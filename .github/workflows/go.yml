# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go
---
name: Go
on: ["push", "pull_request"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      # The landlocktsync build tag swaps go-landlock's thread enforcement and
      # its minimum ABI, which internal/landlock mirrors.
      - name: Vet (landlocktsync)
        run: make vet TAGS=landlocktsync

      - name: Test (landlocktsync)
        run: make test TAGS=landlocktsync

  sbom:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: Download dependencies
        run: go mod download

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.51.0

      - name: Generate SBOM
        run: make sbom
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: ssh-sign-sbom
          path: build/ssh-sign.spdx.json
          if-no-files-found: error
