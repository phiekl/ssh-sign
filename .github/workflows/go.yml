# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go
---
name: Go
on: ["push", "pull_request"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 1.24 is the minimum go.mod allows; anything older only makes
        # the toolchain download 1.24 and test nothing new.
        go-version: ["1.24", "1.26"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test
        run: make test

  sbom:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Download dependencies
        run: go mod download

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.51.0

      - name: Generate SBOM
        run: make sbom
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: ssh-sign-sbom
          path: build/ssh-sign.spdx.json
          if-no-files-found: error
